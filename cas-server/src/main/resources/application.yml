server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: CampusAppointmentSystem
  mail:
    host: ${EMAIL_HOST:smtp.163.com}
    port: ${EMAIL_PORT:465}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/cas_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.laoliu.cas.**.dataobject
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
    path: ${FILE_UPLOAD_PATH:./uploads/}
    prefix: ${FILE_UPLOAD_PREFIX:/api/files/}
    url-prefix: ${FILE_UPLOAD_URL_PREFIX:/uploads}
    server-address: ${FILE_SERVER_ADDRESS:http://localhost:8080}

email:
  subject: ${EMAIL_SUBJECT:验证码}
  content: ${EMAIL_CONTENT:您的验证码是：}
  code:
    expiration: ${EMAIL_CODE_EXPIRATION:300}
  send:
    frequency:
      limit: ${EMAIL_SEND_FREQUENCY_LIMIT:60}

logging:
  level:
    com.laoliu: ${LOG_LEVEL:debug}

weather:
  api:
    url: ${WEATHER_API_URL:https://cn.apihz.cn/api/tianqi/tqyb.php}
    id: ${WEATHER_API_ID:}
    key: ${WEATHER_API_KEY:}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
  sms:
    sign-name: ${ALIYUN_SMS_SIGN_NAME:校园预约系统}
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  region-id: ${ALIYUN_REGION_ID:cn-hangzhou}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
